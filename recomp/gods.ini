; libroger's settings for gods (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; Intro (the passwords notice, the credits) and Gods' title, high score
; table and loading screens use rows 0-199; the game, 0-190 (the play area
; and the status panel) and the hint messages scrolled below it, to 210
rows = 0-210
